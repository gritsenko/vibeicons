# Static host for the built app. TLS, auth and the public hostname are the
# platform proxy's job — this is plain http on 0.0.0.0:80 inside the container.
server {
    listen 0.0.0.0:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Pre-compressed .gz twins are produced at image build time (see Dockerfile);
    # gzip on covers whatever is left.
    gzip_static on;
    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json text/plain;

    # Route health probe.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Icon libraries: content-addressed by name, multi-MB, worth caching hard.
    location /libraries/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Vite emits hashed file names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The shell and the catalog manifest must not be pinned — a redeploy has to
    # be picked up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /preset.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
